<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Yanora priority concept glass console">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFB"/>
      <stop offset=".55" stop-color="#EEF4F7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#EDF3F6" stop-opacity=".82"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg2)"/>
  <circle cx="1110" cy="160" r="310" fill="#B9CBDC" opacity=".16"/>
  <circle cx="250" cy="760" r="260" fill="#DDE5EC" opacity=".34"/>

  <text x="94" y="116" fill="#6F8998" font-size="13" letter-spacing="5" font-family="Arial">FACE PRIORITY CONSOLE</text>
  <text x="94" y="178" fill="#1C2B3A" font-size="38" font-weight="300" font-family="Arial">真正的问题，往往不是用户以为的问题。</text>
  <text x="94" y="218" fill="#6B7280" font-size="17" font-family="Arial">先建立面部优先级，再决定项目顺序。</text>

  <g transform="translate(94 292)">
    <rect width="1248" height="424" fill="url(#panel)" stroke="#DDE5EC"/>
    <rect x="0" y="0" width="1248" height="56" fill="#fff" opacity=".56"/>
    <text x="34" y="36" fill="#6F8998" font-size="11" letter-spacing="4" font-family="Arial">REQUEST</text>
    <text x="516" y="36" fill="#6F8998" font-size="11" letter-spacing="4" font-family="Arial">YANORA DECISION SYSTEM</text>
    <text x="1072" y="36" fill="#6F8998" font-size="11" letter-spacing="4" font-family="Arial">PRIORITY 02/03</text>

    <g transform="translate(46 108)">
      <rect width="360" height="216" fill="#fff" stroke="#DDE5EC"/>
      <text x="28" y="42" fill="#6F8998" font-size="11" letter-spacing="3" font-family="Arial">用户原本想做</text>
      <rect x="28" y="78" width="138" height="44" fill="#F7F9FA" stroke="#B9CBDC"/>
      <text x="54" y="106" fill="#1C2B3A" font-size="20" font-family="Arial">填充</text>
      <rect x="28" y="138" width="168" height="44" fill="#F7F9FA" stroke="#B9CBDC"/>
      <text x="54" y="166" fill="#1C2B3A" font-size="20" font-family="Arial">法令纹</text>
    </g>

    <g transform="translate(488 130)">
      <circle cx="70" cy="70" r="66" fill="none" stroke="#B9CBDC"/>
      <path d="M34 70h120m0 0-26-18m26 18-26 18" stroke="#1C2B3A" fill="none" stroke-width="2"/>
      <circle cx="20" cy="70" r="6" fill="#B9CBDC"/>
      <circle cx="120" cy="70" r="6" fill="#B9CBDC"/>
      <text x="26" y="162" fill="#6F8998" font-size="10" letter-spacing="3" font-family="Arial">READING</text>
    </g>

    <g transform="translate(690 108)">
      <rect width="500" height="216" fill="#1C2B3A"/>
      <text x="34" y="44" fill="#B9CBDC" font-size="11" letter-spacing="3" font-family="Arial">应该优先</text>
      <text x="34" y="96" fill="#fff" font-size="26" font-weight="300" font-family="Arial">先恢复中面支撑，</text>
      <text x="34" y="136" fill="#fff" font-size="26" font-weight="300" font-family="Arial">而不是直接填充局部纹路。</text>
      <text x="34" y="184" fill="#B9CBDC" font-size="13" font-family="Arial">SUPPORT FIRST</text>
    </g>
  </g>

  <g transform="translate(98 760)">
    <rect width="180" height="44" fill="#1C2B3A"/>
    <text x="24" y="28" fill="#fff" font-size="12" letter-spacing="3" font-family="Arial">STYLE B</text>
    <rect x="1010" width="44" height="44" fill="#fff" stroke="#B9CBDC"/>
    <text x="1025" y="29" fill="#6F8998" font-size="20" font-family="Arial">←</text>
    <rect x="1064" width="44" height="44" fill="#fff" stroke="#B9CBDC"/>
    <text x="1079" y="29" fill="#6F8998" font-size="20" font-family="Arial">→</text>
  </g>
