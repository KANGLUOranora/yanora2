<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800" role="img" aria-label="Yanora editorial face analysis portrait">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset=".42" stop-color="#e9f0f5"/>
      <stop offset="1" stop-color="#c9d7e3"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="31%" r="48%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".44" stop-color="#d7e3ed" stop-opacity=".78"/>
      <stop offset="1" stop-color="#9dadbd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1=".22" x2=".82" y1=".1" y2=".95">
      <stop offset="0" stop-color="#f8e6dc"/>
      <stop offset=".48" stop-color="#e7c3b5"/>
      <stop offset="1" stop-color="#b98778"/>
    </linearGradient>
    <linearGradient id="skinShade" x1=".18" x2=".86" y1=".05" y2=".94">
      <stop offset="0" stop-color="#fff6ef" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#c89485" stop-opacity=".62"/>
      <stop offset="1" stop-color="#6f4b48" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="hair" x1=".24" x2=".8" y1=".02" y2=".92">
